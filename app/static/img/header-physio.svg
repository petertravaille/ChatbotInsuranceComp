<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Physiotherapist helping a patient with knee exercise" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3ecfb"/><stop offset="1" stop-color="#c4d6f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg2)"/>
  <circle cx="60" cy="40" r="55" fill="#ffffff" opacity=".35"/>
  <!-- treatment table -->
  <rect x="40" y="150" width="230" height="16" rx="6" fill="#5b7bb5"/>
  <rect x="60" y="166" width="10" height="40" fill="#44629a"/>
  <rect x="240" y="166" width="10" height="40" fill="#44629a"/>
  <!-- patient lying, leg raised -->
  <circle cx="70" cy="132" r="16" fill="#e0a982"/>
  <rect x="86" y="126" width="80" height="24" rx="11" fill="#f2a541"/>
  <path d="M160 140 l55 -48" stroke="#2c3e63" stroke-width="20" stroke-linecap="round"/>
  <path d="M215 92 l14 -6" stroke="#e0a982" stroke-width="12" stroke-linecap="round"/>
  <!-- physio standing -->
  <circle cx="290" cy="62" r="20" fill="#9b6b4f"/>
  <path d="M272 56 q18 -30 38 0 q-2 -20 -19 -22 q-17 2 -19 22z" fill="#1f1f2e"/>
  <path d="M262 160 q-4 -70 28 -76 q32 6 28 76z" fill="#2f9e8f"/>
  <path d="M268 104 q-30 2 -46 -8" stroke="#2f9e8f" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M274 116 q-40 16 -66 -2" stroke="#2f9e8f" stroke-width="13" stroke-linecap="round" fill="none"/>
  <rect x="272" y="158" width="14" height="50" rx="6" fill="#26405f"/>
  <rect x="296" y="158" width="14" height="50" rx="6" fill="#26405f"/>
  <!-- motion arcs -->
  <path d="M232 60 a40 40 0 0 1 20 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- counter -->
  <g transform="translate(330 140)">
    <rect width="54" height="54" rx="12" fill="#ffffff"/>
    <text x="27" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2c3e63">9</text>
    <text x="27" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b7bb5">visits</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
